<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Student</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar">
        <a class="brand" href="{{ url_for('home') }}">Green Valley College</a>
        <div class="nav-links">
            <a href="{{ url_for('home') }}">Home</a>
            <a href="{{ url_for('register') }}">Register</a>
            <a href="{{ url_for('student_records') }}">Students</a>
            <a href="{{ url_for('about') }}">About</a>
        </div>
    </nav>

    <main class="page-wrap">
        <section class="page-header">
            <p class="eyebrow">New Admission</p>
            <h1>Student Registration</h1>
            <p>Enter the student details below. Database storage will be added in the next phase.</p>
        </section>

        <section class="form-panel">
            <form>
                <div class="form-grid">
                    <label>
                        Student Name
                        <input type="text" name="student_name" placeholder="Enter full name">
                    </label>
                    <label>
                        Roll Number
                        <input type="text" name="roll_number" placeholder="Enter roll number">
                    </label>
                    <label>
                        Department
                        <select name="department">
                            <option value="">Select department</option>
                            <option>CSE</option>
                            <option>IT</option>
                            <option>ECE</option>
                            <option>EEE</option>
                            <option>MECH</option>
                            <option>CIVIL</option>
                        </select>
                    </label>
                    <label>
                        Year
                        <select name="year">
                            <option value="">Select year</option>
                            <option>1</option>
                            <option>2</option>
                            <option>3</option>
                            <option>4</option>
                        </select>
                    </label>
                    <label>
                        Email
                        <input type="email" name="email" placeholder="student@example.com">
                    </label>
                    <label>
                        Phone Number
                        <input type="tel" name="phone" placeholder="Enter phone number">
                    </label>
                    <label>
                        Gender
                        <select name="gender">
                            <option value="">Select gender</option>
                            <option>Female</option>
                            <option>Male</option>
                            <option>Other</option>
                        </select>
                    </label>
                    <label class="full">
                        Address
                        <textarea name="address" rows="4" placeholder="Enter address"></textarea>
                    </label>
                </div>
                <div class="form-actions">
                    <button class="btn primary" type="submit">Submit Registration</button>
                    <button class="btn ghost" type="reset">Clear Form</button>
                </div>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Green Valley College. Student Registration System.</p>
    </footer>
</body>
</html>
