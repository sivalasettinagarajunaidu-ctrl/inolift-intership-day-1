{% extends "base.html" %}

{% block title %}Page Not Found - Diabetes Risk Predictor{% endblock %}

{% block content %}
<div class="error-container">
    <div class="error-content">
        <div class="error-code">404</div>
        <h1>Page Not Found</h1>
        <p>Sorry, the page you're looking for doesn't exist.</p>
        <a href="{{ url_for('home') }}" class="btn btn-primary">Go Back Home</a>
    </div>
</div>

<style>
.error-container {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 500px;
    padding: 20px;
}

.error-content {
    text-align: center;
}

.error-code {
    font-size: 5rem;
    font-weight: bold;
    color: #667eea;
    margin-bottom: 20px;
}

.error-content h1 {
    font-size: 2rem;
    color: #333;
    margin-bottom: 10px;
}

.error-content p {
    color: #666;
    margin-bottom: 30px;
    font-size: 1.1rem;
}
</style>
{% endblock %}
